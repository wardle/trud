name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      JVM_OPTS: -Xmx3200m

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Install Clojure CLI
        uses: DeLaGuardo/setup-clojure@12.5
        with:
          cli: latest

      - name: Add api-key for test
        run: echo $API_KEY > api-key.txt
        env:
          API_KEY: ${{ secrets.API_KEY }}

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: m2-${{ hashFiles('deps.edn') }}
          restore-keys: m2-

      - name: Prepare test dependencies
        run: clojure -P -M:test

      - name: Run compilation checks
        run: clojure -M:check

      - name: Run tests
        run: clojure -M:test
